<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Korisnički profil</title>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
</head>
<body>

<h1>Korisnički profil</h1>

<p><b>Email:</b> <span id="email"></span></p>

<p>
    <a href="datatable.html">Povratak na tablicu</a> |
    <a href="#" id="logout">Odjava</a>
</p>

<script>
const authConfig = {
    domain: "dev-4w7gzuvyminy3ghu.us.auth0.com",
    clientId: "XrFCHFygPOmSDVIatxmcZaaDkGIj67zF",
    authorizationParams: {
        redirect_uri: window.location.origin + "/profile.html",
        scope: "openid email"
    }
};

(async () => {
    const auth0Client = await auth0.createAuth0Client(authConfig);

    if (window.location.search.includes("code=")) {
        await auth0Client.handleRedirectCallback();
        window.history.replaceState({}, document.title, "/profile.html");
    }

    if (!(await auth0Client.isAuthenticated())) {
        await auth0Client.loginWithRedirect();
        return;
    }

    const user = await auth0Client.getUser();
    document.getElementById("email").innerText = user.email;

    document.getElementById("logout").onclick = () =>
        auth0Client.logout({
            logoutParams: {
                returnTo: window.location.origin + "/datatable.html"
            }
        });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Interaktivna tablica - Europska skijališta</title>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 4px;
        }
        input, select {
            margin-top: 10px;
            padding: 5px;
        }
        nav a {
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <h1>Interaktivna tablica - Europska skijališta</h1>
    <nav>
        <a href="#" id="loginLink">Prijava</a>
        <a href="profile.html" id="profileLink" style="display:none;">Korisnički profil</a>
        <a href="#" id="refreshLink" style="display:none;">Osvježi preslike</a>
        <a href="#" id="logoutLink" style="display:none;">Odjava</a>
    </nav>
    <hr>


    <label>Filtriraj: </label>
    <input type="text" id="filterText" placeholder="Upiši pojam...">

    <label> Atribut: </label>
    <select id="filterField">
        <option value="Naziv">Naziv skijališta</option>
        <option value="Drzava">Država</option>
        <option value="Regija">Regija</option>
        <option value="Naziv_staze">Naziv staze</option>
        <option value="Tezina_staze">Težina staze</option>
    </select>

    <button onclick="downloadJSON()">Preuzmi filtrirano (JSON)</button>
    <button onclick="downloadCSV()">Preuzmi filtrirano (CSV)</button>

    <table id="table">
        <thead>
            <tr>
                <th>Naziv</th>
                <th>Država</th>
                <th>Regija</th>
                <th>Visina_pocetna</th>
                <th>Visina_vrh</th>
                <th>Staza</th>
                <th>Duljina staze</th>
                <th>Težina</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="datatable.js"></script>
</body>
</html>
